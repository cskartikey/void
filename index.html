<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>void</title>
  <meta name="description" content="Type anything and send it into the void. Nothing is kept.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="wordmark">void</div>

    <div class="hole" aria-hidden="true">
      <div class="hot bloom"></div>
      <div class="kick"><div class="disk"></div></div>
      <div class="hot"></div>
      <div class="core"></div>
    </div>

    <div class="flights" aria-hidden="true"></div>

    <textarea class="box field" aria-label="Write here" placeholder="Write something." autofocus spellcheck="false"></textarea>

    <footer class="foot">
      <span>made by <a href="https://cskartikey.dev" target="_blank" rel="noopener" class="credits">@cskartikey</a></span>
      <div class="note">
        <span>Enter to send. Nothing is kept.</span>
        <span><a href="https://github.com/cskartikey/void" target="_blank" rel="noopener" class="credits">Source on GitHub</a></span>
      </div>
      <button class="sound" type="button" aria-pressed="true">Sound on</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
